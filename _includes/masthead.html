<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="#about-me">
              <span lang="zh-CN">主页</span>
              <span lang="en">Homepage</span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ link.url }}">
                <span lang="zh-CN">{{ link.title_zh }}</span>
                <span lang="en">{{ link.title_en }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <div class="language-switcher">
      <button type="button" id="lang-toggle" aria-label="Switch language">
        <span lang="zh-CN">English</span>
        <span lang="en">中文</span>
      </button>
    </div>
  </div>
</div>
